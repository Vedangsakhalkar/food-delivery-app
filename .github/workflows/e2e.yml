name: E2E

on:
  pull_request:
    branches: [release/dev]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The journey tests need a dev Supabase project. Add these repository secrets to enable them;
    # without them the journey is skipped and the accessibility/security checks still run.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SECRET_KEY }}
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      DATABASE_URL_MIGRATIONS: ${{ secrets.E2E_DATABASE_URL }}
      SUPABASE_STORAGE_BUCKET: images
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
