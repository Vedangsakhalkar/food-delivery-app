<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>States</title><link rel="stylesheet" href="style.css"><style>.sk{background:linear-gradient(90deg,#eee,#f7f7f7,#eee);border-radius:8px;height:14px;margin:8px 0}</style></head><body>
<header class="top"><a class="logo" href="index.html">FoodDash</a><span class="muted">Loading, empty and error states</span></header>
<div class="wrap"><h1>Loading</h1><div class="grid"><div class="rcard"><div class="img"></div><div class="b"><div class="sk" style="width:60%"></div><div class="sk"></div></div></div><div class="rcard"><div class="img"></div><div class="b"><div class="sk" style="width:60%"></div><div class="sk"></div></div></div></div>
<h1 style="margin-top:24px">Empty</h1><div class="grid"><div class="state">No restaurants in your area yet.</div><div class="state">Your cart is empty.</div><div class="state">No orders yet.</div><div class="state">No menu items yet.</div></div>
<h1 style="margin-top:24px">Error</h1><div class="grid"><div class="state" style="border-color:var(--red)">Couldn't load restaurants.<br><br><button class="btn sm">Retry</button></div><div class="state" style="border-color:var(--red)">Network offline. Check your connection.</div></div></div></body></html>
